name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run JDBC target tests
        run: |
          set +e
          python -m pytest apps/jdbc-target/tests -q 2>&1 | tee jdbc-target-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python scripts/classify_test_failure.py jdbc-target-test.log --suite jdbc-target
            exit "$status"
          fi

      - name: Run HRMS service tests
        run: |
          set +e
          python -m pytest apps/hrms-service/tests -q 2>&1 | tee hrms-service-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python scripts/classify_test_failure.py hrms-service-test.log --suite hrms-service
            exit "$status"
          fi

      - name: Run IdP service tests
        run: |
          set +e
          python -m pytest apps/idp-service/tests -q 2>&1 | tee idp-service-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python scripts/classify_test_failure.py idp-service-test.log --suite idp-service
            exit "$status"
          fi

      - name: Run IGA service tests
        run: |
          set +e
          python -m pytest apps/iga-service/tests -q 2>&1 | tee iga-service-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python scripts/classify_test_failure.py iga-service-test.log --suite iga-service
            exit "$status"
          fi

      - name: Run ZSP JIT app tests
        run: |
          set +e
          python -m pytest apps/zsp-jit-app/tests -q 2>&1 | tee zsp-jit-app-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python scripts/classify_test_failure.py zsp-jit-app-test.log --suite zsp-jit-app
            exit "$status"
          fi
