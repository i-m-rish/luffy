name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run JDBC target tests
        run: |
          python -m pytest apps/jdbc-target/tests -q

      - name: Run HRMS service tests
        run: |
          python -m pytest apps/hrms-service/tests -q

      - name: Run IdP service tests
        run: |
          python -m pytest apps/idp-service/tests -q
